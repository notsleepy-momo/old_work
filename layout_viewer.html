<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>户型图可视化</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Inter', sans-serif;
  background: #f0f2f5; color: #333;
  min-height: 100vh; display: flex; flex-direction: column;
}
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 20px; background: #fff; border-bottom: 1px solid #e0e4e8;
  flex-shrink: 0;
}
.header h1 { font-size: 15px; font-weight: 600; }
.btn {
  font-size: 12px; font-weight: 500; padding: 7px 13px;
  border: 1px solid #d0d5dd; border-radius: 6px; cursor: pointer;
  background: #fff; color: #333; transition: all 0.2s;
}
.btn:hover { background: #f0f2f5; }
.btn-primary { background: #4A90D9; color: #fff; border-color: #4A90D9; }
.btn-primary:hover { background: #357ABD; }
.main { display: flex; flex: 1; overflow: hidden; }
.canvas-wrap {
  flex: 1; overflow: auto; display: flex; align-items: center;
  justify-content: center; padding: 24px; background: #f0f2f5;
}
canvas { background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,0.08); border-radius: 4px; }
.empty-state { text-align: center; color: #8a8fa0; }
.empty-state .icon { font-size: 40px; margin-bottom: 10px; }
.empty-state h2 { font-size: 15px; color: #333; margin-bottom: 4px; }
.empty-state p { font-size: 12px; }
.status {
  padding: 6px 20px; font-size: 11px; color: #8a8fa0;
  background: #fff; border-top: 1px solid #e0e4e8; display: flex;
  justify-content: space-between; flex-shrink: 0;
}
</style>
</head>
<body>
<header class="header">
  <h1>House Plan Viewer</h1>
  <div style="display:flex;gap:8px">
    <label class="btn" style="cursor:pointer">
      <input type="file" id="fi" accept=".yaml,.yml" style="display:none"> Open YAML
    </label>
    <button class="btn" id="btnReset">Reset</button>
    <button class="btn btn-primary" id="btnSave">Save PNG</button>
  </div>
</header>
<div class="main">
  <div class="canvas-wrap">
    <div class="empty-state" id="empty">
      <div class="icon">📂</div>
      <h2>No floor plan loaded</h2>
      <p>Drop a YAML file or click "Open YAML"</p>
    </div>
    <canvas id="c"></canvas>
  </div>
</div>
<div class="status">
  <span id="sl">Ready — Drop YAML file or Ctrl+O</span>
  <span id="sr"></span>
</div>

<script>
// ── Colors (matching floorplan_renderer.py exactly) ──
const RC = ['#FFF5E6','#E8F0FE','#E6F7E6','#FDE8E8','#F3E8FF',
  '#E0F7FA','#FFF8E1','#FBE9E7','#E8EAF6','#F1F8E9',
  '#FCE4EC','#E0F2F1','#FFF3E0','#EDE7F6','#E1F5FE'];
const WALL_C = '#555555';
const DOOR_C = '#8B4513';
const DOOR_F = '#F5DEB3';
const FUR_C = 'rgba(74,144,217,0.6)';
const FUR_E = '#2C5F8A';

let data = null;
const c = document.getElementById('c'), g = c.getContext('2d');
c.style.display = 'none';

// ── YAML Parser ──
function $(t) {
  const ls = t.split('\n').filter(l => !l.trim().startsWith('#'));
  let y = {};
  let s = [{ obj: y, key: null, indent: -1, pending: false }];
  for (let l of ls) {
    if (!l.trim()) continue;
    const ind = l.search(/\S/), ct = l.trim();
    while (s.length > 1) {
      const top = s[s.length-1];
      if (top.indent >= ind && !(top.pending && ct.startsWith('- ') && top.indent === ind)) s.pop();
      else break;
    }
    const p = s[s.length-1];
    if (ct.startsWith('- ')) {
      const v = ct.substring(2).trim();
      let it = parseVal(v);
      let lst;
      if (p.key !== null) {
        if (!Array.isArray(p.obj[p.key])) p.obj[p.key] = [];
        lst = p.obj[p.key];
      } else lst = p.obj;
      lst.push(it);
      s.push({ obj: it, key: null, indent: ind, pending: false });
    } else if (ct.includes(':')) {
      const ci = ct.indexOf(':');
      const k = ct.substring(0,ci).trim();
      const v = ct.substring(ci+1).trim();
      if (v === '') {
        if (p.obj[k] === undefined) p.obj[k] = null;
        s.push({ obj: p.obj, key: k, indent: ind, pending: true });
      } else if (v.startsWith('{')) p.obj[k] = parseIDict(v);
      else if (v.startsWith('[')) p.obj[k] = parseIList(v);
      else p.obj[k] = parseS(v);
    }
  }
  cleanNulls(y);
  return y;
}
function cleanNulls(o) {
  if (!o || typeof o !== 'object') return o;
  if (Array.isArray(o)) { for (let it of o) cleanNulls(it); }
  else { for (let k of Object.keys(o)) { if (o[k]===null) o[k]=[]; else cleanNulls(o[k]); } }
  return o;
}
function parseVal(v) {
  if (v.startsWith('{')&&v.endsWith('}')) return parseIDict(v);
  if (v.startsWith('[')&&v.endsWith(']')) return parseIList(v);
  if (v.includes(':')) { const ci=v.indexOf(':'); const o={}; o[v.substring(0,ci).trim()]=parseS(v.substring(ci+1).trim()); return o; }
  return parseS(v);
}
function parseIDict(s) {
  const inner = s.slice(1,-1); const o={};
  const ps = inner.match(/(?:[^,{}]|\{[^}]*\})+/g)||[];
  for (let p of ps) { const ci=p.indexOf(':'); if(ci<0) continue; o[p.substring(0,ci).trim()]=parseS(p.substring(ci+1).trim()); }
  return o;
}
function parseIList(s) { const i=s.slice(1,-1); if(!i.trim()) return []; return i.split(',').map(x=>parseS(x.trim())); }
function parseS(v) {
  if (v==='true') return true; if (v==='false') return false;
  if (v==='null'||v==='~') return null;
  if (/^-?\d+\.\d+$/.test(v)) return parseFloat(v);
  if (/^-?\d+$/.test(v)) return parseInt(v,10);
  if ((v.startsWith('"')&&v.endsWith('"'))||(v.startsWith("'")&&v.endsWith("'"))) return v.slice(1,-1);
  return v;
}

// ── File ──
function load(f) {
  const r = new FileReader();
  r.onload = e => { try { data=$(e.target.result); render(); document.getElementById('sl').textContent='Loaded: '+f.name; } catch(err) { alert('Parse error: '+err.message); } };
  r.readAsText(f);
}
const fi = document.getElementById('fi');
fi.addEventListener('change', e => { if(e.target.files[0]) load(e.target.files[0]); });
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  e.preventDefault();
  const f = e.dataTransfer.files[0];
  if (f && /\.ya?ml$/i.test(f.name)) load(f);
});
document.addEventListener('paste', e => {
  const t = e.clipboardData.getData('text');
  if (t && t.includes('house:') && t.includes('rooms:')) { try { data=$(t); render(); } catch(err){} }
});

// ── Render ──
function render() {
  if (!data) return;
  const h = data.house || {}, rs = h.rooms || [], sz = h.size || {};
  const mw = Number(sz.x)||100, mh = Number(sz.y)||100;
  const dpr = window.devicePixelRatio||1;
  const cw = c.parentElement.clientWidth-48, ch = c.parentElement.clientHeight-48;
  const pad = 55;
  const rw = Math.min(cw-pad*2, (ch-pad*2)*mw/mh), rh = rw*mh/mw;

  c.width = (rw+pad*2)*dpr; c.height = (rh+pad*2)*dpr;
  c.style.width = (rw+pad*2)+'px'; c.style.height = (rh+pad*2)+'px';
  c.style.display = 'block';
  document.getElementById('empty').style.display = 'none';

  g.setTransform(1,0,0,1,0,0); g.scale(dpr,dpr);
  g.clearRect(0,0,c.width,c.height);
  g.fillStyle='#fff'; g.fillRect(0,0,rw+pad*2,rh+pad*2);

  // Grid
  g.strokeStyle='#f0f0f0'; g.lineWidth=0.5;
  const gs = Math.max(5, Math.floor(Math.min(mw,mh)/8));
  for (let x=0; x<=mw; x+=gs) { const sx=pad+(x/mw)*rw; g.beginPath(); g.moveTo(sx,pad); g.lineTo(sx,pad+rh); g.stroke(); }
  for (let y=0; y<=mh; y+=gs) { const sy=pad+(y/mh)*rh; g.beginPath(); g.moveTo(pad,sy); g.lineTo(pad+rw,sy); g.stroke(); }

  const drawn = new Set();
  let ci = 0;

  for (let room of rs) {
    const pos = room.position||{}, rx=Number(pos.x)||0, ry=Number(pos.y)||0;
    const rr=Number(pos.width)||0, rr2=Number(pos.height)||0;
    const sx=pad+(rx/mw)*rw, sy=pad+(ry/mh)*rh;
    const sw=(rr/mw)*rw, sh=(rr2/mh)*rh;
    const color = RC[ci%RC.length];

    // Room fill
    g.fillStyle=color; g.globalAlpha=0.7;
    g.fillRect(sx,sy,sw,sh); g.globalAlpha=1;

    // Walls
    const walls = room.walls||{};
    g.strokeStyle=WALL_C; g.lineWidth=2; g.lineCap='round';
    if (walls.top) { g.beginPath(); g.moveTo(sx,sy+sh); g.lineTo(sx+sw,sy+sh); g.stroke(); }
    if (walls.right) { g.beginPath(); g.moveTo(sx+sw,sy); g.lineTo(sx+sw,sy+sh); g.stroke(); }
    if (walls.bottom) { g.beginPath(); g.moveTo(sx,sy); g.lineTo(sx+sw,sy); g.stroke(); }
    if (walls.left) { g.beginPath(); g.moveTo(sx,sy); g.lineTo(sx,sy+sh); g.stroke(); }

    // Doors
    for (let door of (room.doors||[])) {
      const did = door.id||`${rx}_${ry}`;
      if (drawn.has(did)) continue;
      drawn.add(did);
      const dx=Number(door.x)||0, dy=Number(door.y)||0;
      const dsx=pad+(dx/mw)*rw, dsy=pad+(dy/mh)*rh;

      // Door leaf
      const dl = 4;
      const dists = {top:Math.abs(dy-(ry+rr2)),bottom:Math.abs(dy-ry),left:Math.abs(dx-rx),right:Math.abs(dx-(rx+rr))};
      let side = 'top'; let minD=Infinity;
      for (let [k,v] of Object.entries(dists)) if(v<minD){minD=v;side=k;}

      g.fillStyle=DOOR_F; g.strokeStyle=DOOR_C; g.lineWidth=1.5;
      if (side==='top'||side==='bottom') {
        g.fillRect(dsx-dl/2, dsy-1, dl, 2);
        g.beginPath(); g.arc(dsx-dl/2, dsy, dl, 0, side==='top'?Math.PI:0, side==='top');
        g.stroke();
      } else {
        g.fillRect(dsx-1, dsy-dl/2, 2, dl);
        g.beginPath(); g.arc(dsx, dsy-dl/2, dl, 0, Math.PI/2, side==='left');
        g.stroke();
      }
    }

    // Furniture
    for (let fur of (room.furniture||[])) {
      const fp=fur.position||{}, fx=Number(fp.x)||0, fy=Number(fp.y)||0;
      const fw2=Number(fp.width)||0, fh2=Number(fp.height)||0;
      const fsx=pad+(fx/mw)*rw, fsy=pad+(fy/mh)*rh;
      const fsw=(fw2/mw)*rw, fsh=(fh2/mh)*rh;
      if (fsw<3||fsh<3) continue;

      g.fillStyle=FUR_C; g.strokeStyle=FUR_E; g.lineWidth=1.5;
      g.fillRect(fsx,fsy,fsw,fsh); g.strokeRect(fsx,fsy,fsw,fsh);
      // Hatch
      g.strokeStyle='rgba(255,255,255,0.35)'; g.lineWidth=0.6;
      for (let hx=fsx+2; hx<fsx+fsw; hx+=3) { g.beginPath(); g.moveTo(hx,fsy); g.lineTo(hx,fsy+fsh); g.stroke(); }

      const lbl = fur.name||fur.id||'';
      if (lbl && fsw>20 && fsh>10) {
        g.fillStyle='#fff'; const fs2 = Math.max(8, Math.min(11, fsw*0.15));
        g.font=`bold ${fs2}px Inter`; g.textAlign='center';
        g.fillText(lbl, fsx+fsw/2, fsy+fsh/2+fs2/3);
      }
    }

    // Room label
    const lname = room.name||'';
    const cx2=sx+sw/2, cy2=sy+sh/2;
    g.font='bold 12px Inter'; g.textAlign='center';
    const tw = g.measureText(lname).width;
    g.fillStyle='rgba(255,255,255,0.65)';
    roundR(g, cx2-tw/2-8, cy2-10, tw+16, 20, 4);
    g.fill();
    g.fillStyle='#333';
    g.fillText(lname, cx2, cy2+4);

    ci++;
  }

  // Axis labels
  g.fillStyle='#666'; g.font='10px Inter'; g.textAlign='center';
  g.fillText('x (dm)', pad+rw/2, pad+rh+20);
  g.save(); g.translate(pad-18, pad+rh/2); g.rotate(-Math.PI/2);
  g.fillText('y (dm)', 0, 0); g.restore();

  document.getElementById('sr').textContent = `${rs.length} rooms | ${mw.toFixed(0)}×${mh.toFixed(0)} dm`;
}
function roundR(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x+r,y); g.lineTo(x+w-r,y);
  g.quadraticCurveTo(x+w,y,x+w,y+r);
  g.lineTo(x+w,y+h-r);
  g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  g.lineTo(x+r,y+h);
  g.quadraticCurveTo(x,y+h,x,y+h-r);
  g.lineTo(x,y+r);
  g.quadraticCurveTo(x,y,x+r,y);
  g.closePath();
}

// ── Buttons ──
document.getElementById('btnSave').addEventListener('click', () => {
  if (!data) { alert('No data'); return; }
  const a = document.createElement('a');
  a.download = 'floorplan.png'; a.href = c.toDataURL('image/png'); a.click();
});
document.getElementById('btnReset').addEventListener('click', () => {
  data = null; c.style.display = 'none';
  document.getElementById('empty').style.display = '';
  document.getElementById('sl').textContent = 'Ready — Drop YAML file or Ctrl+O';
  document.getElementById('sr').textContent = '';
});
document.addEventListener('keydown', e => {
  if (e.ctrlKey&&e.key==='s') { e.preventDefault(); document.getElementById('btnSave').click(); }
  if (e.ctrlKey&&e.key==='o') { e.preventDefault(); fi.click(); }
});
</script>
</body>
</html>
